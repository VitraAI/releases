name: Publish

# On every merge to main: validate and build, deploy dist/ to GitHub Pages
# (feed.json, <id>.json, index.html), then announce each NEWLY ADDED release
# in Slack. Editing an existing release only redeploys the page.
#
# Slack posts once per release: a successful post pushes the tag slack/<id>,
# and an id that already has the tag (or is backfill) is skipped. Backfilled releases are never
# posted. To post again by hand: Actions → Publish → Run workflow → repost.
#
# Secrets: SLACK_BOT_TOKEN (xoxb-, chat:write, bot invited to the channel)
# Variables: SLACK_CHANNEL (channel ID, C…)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repost:
        description: Release id to post to Slack again (e.g. 26.10.22). Leave empty to only redeploy.
        required: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  announce:
    # After the page is live, so the message's "What's new" link works.
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the slack/<id> tag
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pick releases to announce
        id: pick
        # Every release file is a candidate; the slack/<id> tag (posted once) and
        # the backfill flag decide what is actually sent. Robust to force pushes
        # and to a post that failed on an earlier run.
        run: |
          if [ -n "${{ inputs.repost }}" ]; then
            echo "ids=${{ inputs.repost }}" >> "$GITHUB_OUTPUT"
            echo "force=1" >> "$GITHUB_OUTPUT"
          else
            echo "ids=$(git ls-files 'releases/*.json' | xargs -n1 basename | sed 's/\.json$//' | xargs)" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Slack
        if: steps.pick.outputs.ids != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for id in ${{ steps.pick.outputs.ids }}; do
            if [ "$(node -p "require('./releases/$id.json').backfill === true")" = "true" ]; then
              echo "$id: backfilled, not posted"; continue
            fi
            if [ -z "${{ steps.pick.outputs.force }}" ] && git rev-parse -q --verify "refs/tags/slack/$id" >/dev/null; then
              echo "$id: already posted (tag slack/$id), skipped"; continue
            fi
            if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
              echo "::error::$id needs posting: set the SLACK_BOT_TOKEN secret and the SLACK_CHANNEL variable."
              exit 1
            fi
            node scripts/post-slack.mjs "$id"
            git tag -f "slack/$id" "${{ github.sha }}"
            git push -f origin "refs/tags/slack/$id"
          done
