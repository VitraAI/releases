name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Schema + cross-checks, Prettier, unit tests (incl. the no-internal-leak
      # checks), and the dist/ that Pages would publish.
      - run: npm run check

      # What Slack would get for each release this PR adds — visible in the log.
      - name: Slack preview of added releases
        run: |
          for f in $(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD -- 'releases/*.json'); do
            id=$(basename "$f" .json)
            echo "::group::Slack payload for $id"
            node scripts/post-slack.mjs "$id" --dry-run
            echo "::endgroup::"
          done
